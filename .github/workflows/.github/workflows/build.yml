name: Build Box Java32
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动点按钮编译（最重要！）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (armeabi-v7a java版)
        run: ./gradlew assembleJavaRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Box-Java32-APK
          path: app/build/outputs/apk/java/release/*.apk
